name: Verify portfolio
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.lock
      - run: python -m pytest -q
      - run: npm test
      - name: Validate published artifacts
        run: python scripts/verify_artifacts.py
      # Live Ollama runs are deliberately separate; CI never pretends to run an LLM.
